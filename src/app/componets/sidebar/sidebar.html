<aside class="sidebar" [class.open]="sidebarServices.isOpen()" appClickOutside
  [appClickOutsideEnabled]="sidebarServices.isOpen()" (appClickOutside)="closeIfOpen()">

  <div class="sidebar-header">
    <button class="close-btn" (click)="sidebarServices.toggleSidebar()">✕</button>
  </div>

  <ul class="nav-list">
    @for (item of sidebarServices.visibleSidebarItems(); track item.id) {
    <li class="nav-item" [class.disabled]="item.isDisabled" [routerLink]="!item.isDisabled ? item.route : null"
      [routerLinkActive]="!item.isDisabled ? 'active' : null" (click)="handleItemClick(item)">
      <i class="fa-solid" [class]="item.icon"></i>
      <span class="title">{{ item.title }}</span>
    </li>
    }
  </ul>

  <div class="sidebar-footer">
    <button mat-flat-button matButton="elevated" (click)="openDialog('0ms', '0ms')" class="logout-btn-sidebar">Logout</button>
  </div>
</aside>
