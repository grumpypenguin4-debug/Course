<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton class="dialog-btn-cancel" (click)="onCancel()">{{ data.cancelLabel || 'No' }}</button>
  <button mat-flat-button class="dialog-btn-confirm" (click)="onConfirm()" cdkFocusInitial>{{ data.confirmLabel || 'Yes'
    }}</button>
</mat-dialog-actions>
