<div class="settings">
  <section class="permissions-section">
    <h2>Permissions Management</h2>
    <div class="permissions-list">
      @for (permission of permissions; track permission.id) {
      <div class="permission-item">
        <label [class.disabled]="!permission.canDisable && hasPermission()(permission.id)">
          <mat-slide-toggle [checked]="hasPermission()(permission.id)"
            [disabled]="!permission.canDisable && hasPermission()(permission.id)"
            (change)="togglePermission(permission.id)">
          </mat-slide-toggle>
          <span class="permission-label">{{ permission.label }}</span>
          @if (!permission.canDisable) {
          <span class="badge">Mandatory</span>
          }
        </label>
      </div>
      }
    </div>
  </section>
</div>
